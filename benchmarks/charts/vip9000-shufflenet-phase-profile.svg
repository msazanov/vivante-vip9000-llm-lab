E2E 3,175 мс</text><text x="55" y="355.0" font-size="16" font-weight="600" fill="#111827">Steady-state</text><rect x="250.000" y="325.000" width="16.616" height="45" fill="#2563eb" data-phase="h2d" data-row="1" /><rect x="266.616" y="325.000" width="706.026" height="45" fill="#16a34a" data-phase="device" data-row="1" /><text x="619.629085316771" y="353.0" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">2815,0 мкс</text><rect x="972.642" y="325.000" width="25.050" height="45" fill="#f59e0b" data-phase="run_minus_device" data-row="1" /><rect x="997.692" y="325.000" width="1.965" height="45" fill="#9333ea" data-phase="d2h" data-row="1" /><text x="250.0" y="395.0" font-size="13" fill="#374151">H2D 66,2 мкс · NPU device 2815,0 мкс · драйвер/API 99,9 мкс · D2H 7,8 мкс</text><text x="250.0" y="417.0" font-size="13" fill="#374151">Σ медиан фаз 2,989 мс · медиана E2E 3,026 мс</text><text x="250.0" y="439.0" font-size="13" fill="#374151">p95 E2E 3,183 мс · 330,5 инференса/с</text><line x1="55" y1="465" x2="1145" y2="465" stroke="#d1d5db" /><text x="55" y="510" font-size="20" font-weight="700" fill="#111827">Тепловой контроль</text><text x="55" y="548" font-size="16" fill="#111827">NPU: 35,34 → пик 42,16 → 41,23 °C</text><text x="55" y="578" font-size="15" fill="#374151">частота: 1008–1008 МГц · признаки троттлинга: нет</text><text x="660" y="510" font-size="20" font-weight="700" fill="#111827">Проверка результата</text><text x="660" y="548" font-size="16" fill="#111827">повторяемость: 1000/1000 · CPU golden: не проверен</text><text x="660" y="578" font-size="13" fill="#4b5563">Одинаковый выход подтверждает повторяемость,</text><text x="660" y="599" font-size="13" fill="#4b5563">но не математическую корректность.</text><text x="55" y="670" font-size="13" fill="#4b5563">H2D/D2H на A733 включают map, memcpy и синхронизацию кэша общей DDR; это не PCIe transfer.</text><text x="55" y="697" font-size="13" fill="#4b5563">run содержит device time и overhead драйвера/API. Скорость здесь — инференсы/с, не токены/с.</text></svg>