<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1080" width="1200" height="1080" role="img" aria-labelledby="title description" font-family="Inter, DejaVu Sans, sans-serif"><title id="title">XY-карта реальных тестов Bonsai 27B, VIPLite и CPU golden</title><desc id="description">Две XY-системы и отдельная correctness-панель не смешивают токены языковой модели и запуски ShuffleNet.</desc><rect width="1200" height="1080" fill="#ffffff" /><text x="55.000" y="48.000" font-size="28" font-weight="700" fill="#111827">Что мы действительно измерили</text><text x="55.000" y="76.000" font-size="14" fill="#4b5563">Токены Bonsai, служебные NPU-запуски и golden показаны в разных системах.</text><text x="55.000" y="118.000" font-size="20" font-weight="700" fill="#111827">1. Bonsai 27B: средняя стоимость decode в серии tg128</text><text x="55.000" y="142.000" font-size="13" fill="#4b5563">X = 1000 / median tok/s: это среднее по серии, не профиль отдельного токена. Цвет: PASS / FAIL / не проверено.</text><line x1="150.000" y1="370.000" x2="1110.000" y2="370.000" stroke="#6b7280" stroke-width="1" /><line x1="150.000" y1="165.000" x2="150.000" y2="370.000" stroke="#6b7280" stroke-width="1" /><line x1="150.000" y1="370.000" x2="150.000" y2="375.000" stroke="#6b7280" /><line x1="145.000" y1="370.000" x2="150.000" y2="370.000" stroke="#6b7280" /><text x="150.000" y="391.000" font-size="11" text-anchor="middle" fill="#4b5563">1351,85</text><text x="140.000" y="374.000" font-size="11" text-anchor="end" fill="#4b5563">0,618</text><line x1="390.000" y1="370.000" x2="390.000" y2="375.000" stroke="#6b7280" /><line x1="145.000" y1="318.750" x2="150.000" y2="318.750" stroke="#6b7280" /><text x="390.000" y="391.000" font-size="11" text-anchor="middle" fill="#4b5563">1417,02</text><text x="140.000" y="322.750" font-size="11" text-anchor="end" fill="#4b5563">0,648</text><line x1="630.000" y1="370.000" x2="630.000" y2="375.000" stroke="#6b7280" /><line x1="145.000" y1="267.500" x2="150.000" y2="267.500" stroke="#6b7280" /><text x="630.000" y="391.000" font-size="11" text-anchor="middle" fill="#4b5563">1482,19</text><text x="140.000" y="271.500" font-size="11" text-anchor="end" fill="#4b5563">0,678</text><line x1="870.000" y1="370.000" x2="870.000" y2="375.000" stroke="#6b7280" /><line x1="145.000" y1="216.250" x2="150.000" y2="216.250" stroke="#6b7280" /><text x="870.000" y="391.000" font-size="11" text-anchor="middle" fill="#4b5563">1547,36</text><text x="140.000" y="220.250" font-size="11" text-anchor="end" fill="#4b5563">0,708</text><line x1="1110.000" y1="370.000" x2="1110.000" y2="375.000" stroke="#6b7280" /><line x1="145.000" y1="165.000" x2="150.000" y2="165.000" stroke="#6b7280" /><text x="1110.000" y="391.000" font-size="11" text-anchor="middle" fill="#4b5563">1612,53</text><text x="140.000" y="169.000" font-size="11" text-anchor="end" fill="#4b5563">0,738</text><text x="630.000" y="417.000" font-size="13" text-anchor="middle" font-weight="600" fill="#111827">средняя стоимость decode, мс/токен</text><text x="88.000" y="267.500" transform="rotate(-90 88.000 267.500)" font-size="13" text-anchor="middle" font-weight="600" fill="#111827">скорость, токен/с</text><line x1="838.662" y1="316.716" x2="838.662" y2="312.106" stroke="#d97706" stroke-width="2" /><circle cx="838.662" cy="316.125" r="8" fill="#fbbf24" data-role="model-point" data-run-id="bonsai27b-q1-cpu-a76-pp512-tg128-003" stroke="#d97706" stroke-width="3" /><text x="826.662" y="301.125" font-size="12" text-anchor="end" fill="#111827">A76 ×2 · 128 токенов: 0.650 ток/с · 1538.8 мс/ток</text><line x1="242.903" y1="185.949" x2="242.903" y2="184.839" stroke="#d97706" stroke-width="2" /><circle cx="242.903" cy="185.134" r="8" fill="#fbbf24" data-role="model-point" data-run-id="bonsai27b-q1-cpu-a55-pp512-tg128-001" stroke="#d97706" stroke-width="3" /><text x="254.903" y="208.134" font-size="12" text-anchor="start" fill="#111827">A55 ×6 · 128 токенов: 0.726 ток/с · 1377.1 мс/ток</text><line x1="1017.097" y1="350.161" x2="1017.097" y2="350.161" stroke="#d97706" stroke-width="2" /><polygon points="1017.097,341.161 1026.097,350.161 1017.097,359.161 1008.097,350.161" fill="#ffffff" data-role="model-point" data-run-id="bonsai27b-q1-cpu-a76-smoke-002" stroke="#d97706" stroke-width="3" /><text x="1005.097" y="335.161" font-size="12" text-anchor="end" fill="#111827">A76 ×2 · 8 токенов: 0.630 ток/с · 1587.3 мс/ток</text><text x="55.000" y="442.000" font-size="20" font-weight="700" fill="#111827">2. VIPLite operator: один запуск NPU-сети изображений</text><text x="55.000" y="466.000" font-size="13" fill="#4b5563">Это не токены и не Bonsai. Y = 1000 / latency: другая запись той же метрики, не независимый throughput.</text><line x1="150.000" y1="678.000" x2="1110.000" y2="678.000" stroke="#6b7280" stroke-width="1" /><line x1="150.000" y1="488.000" x2="150.000" y2="678.000" stroke="#6b7280" stroke-width="1" /><line x1="150.000" y1="678.000" x2="150.000" y2="683.000" stroke="#6b7280" /><line x1="145.000" y1="678.000" x2="150.000" y2="678.000" stroke="#6b7280" /><text x="150.000" y="699.000" font-size="11" text-anchor="middle" fill="#4b5563">2,80</text><text x="140.000" y="682.000" font-size="11" text-anchor="end" fill="#4b5563">306,528</text><line x1="390.000" y1="678.000" x2="390.000" y2="683.000" stroke="#6b7280" /><line x1="145.000" y1="630.500" x2="150.000" y2="630.500" stroke="#6b7280" /><text x="390.000" y="699.000" font-size="11" text-anchor="middle" fill="#4b5563">2,92</text><text x="140.000" y="634.500" font-size="11" text-anchor="end" fill="#4b5563">318,940</text><line x1="630.000" y1="678.000" x2="630.000" y2="683.000" stroke="#6b7280" /><line x1="145.000" y1="583.000" x2="150.000" y2="583.000" stroke="#6b7280" /><text x="630.000" y="699.000" font-size="11" text-anchor="middle" fill="#4b5563">3,03</text><text x="140.000" y="587.000" font-size="11" text-anchor="end" fill="#4b5563">331,351</text><line x1="870.000" y1="678.000" x2="870.000" y2="683.000" stroke="#6b7280" /><line x1="145.000" y1="535.500" x2="150.000" y2="535.500" stroke="#6b7280" /><text x="870.000" y="699.000" font-size="11" text-anchor="middle" fill="#4b5563">3,14</text><text x="140.000" y="539.500" font-size="11" text-anchor="end" fill="#4b5563">343,763</text><line x1="1110.000" y1="678.000" x2="1110.000" y2="683.000" stroke="#6b7280" /><line x1="145.000" y1="488.000" x2="150.000" y2="488.000" stroke="#6b7280" /><text x="1110.000" y="699.000" font-size="11" text-anchor="middle" fill="#4b5563">3,26</text><text x="140.000" y="492.000" font-size="11" text-anchor="end" fill="#4b5563">356,175</text><text x="630.000" y="725.000" font-size="13" text-anchor="middle" font-weight="600" fill="#111827">время одного запуска, мс/inference</text><text x="88.000" y="583.000" transform="rotate(-90 88.000 583.000)" font-size="13" text-anchor="middle" font-weight="600" fill="#111827">скорость, inference/с</text><circle cx="622.952" cy="586.237" r="8" fill="#93c5fd" stroke="#2563eb" stroke-width="3" data-role="operator-point" data-run-id="vip9000-shufflenet-h2d-run-d2h-1000-001" /><text x="634.952" y="571.237" font-size="12" text-anchor="start" fill="#111827">ShuffleNet · полный вход→NPU→выход: 3.026 мс · 330.5/с · golden нет</text><circle cx="750.571" cy="610.965" r="8" fill="#93c5fd" stroke="#2563eb" stroke-width="3" data-role="operator-point" data-run-id="vip9000-vpm-shufflenet-uint8-output-001" /><text x="738.571" y="595.965" font-size="12" text-anchor="end" fill="#111827">ShuffleNet · run в output-capture прогоне: 3.086 мс · 324.0/с · golden нет</text><circle cx="242.903" cy="506.387" r="8" fill="#93c5fd" stroke="#2563eb" stroke-width="3" data-role="operator-point" data-run-id="vip9000-vpm-shufflenet-uint8-resident100-002" /><text x="254.903" y="491.387" font-size="12" text-anchor="start" fill="#111827">ShuffleNet · steady run-only: 2.846 мс · 351.4/с · golden нет</text><circle cx="1017.097" cy="659.613" r="8" fill="#93c5fd" stroke="#2563eb" stroke-width="3" data-role="operator-point" data-run-id="vip9000-vpm-shufflenet-uint8-single-001" /><text x="1005.097" y="644.613" font-size="12" text-anchor="end" fill="#111827">ShuffleNet · один холодный run: 3.212 мс · 311.3/с · golden нет</text><text x="55.000" y="750.000" font-size="20" font-weight="700" fill="#111827">3. CPU golden Q1: правильность математики</text><text x="55.000" y="774.000" font-size="13" fill="#4b5563">q1-vip-cpu-golden-tests-001: 13/13 PASS · арифметика 10 · защита входов 3. Это CPU reference, не скорость NPU.</text><line x1="150.000" y1="816.000" x2="1010.000" y2="816.000" stroke="#d1d5db" /><line x1="150.000" y1="853.000" x2="1010.000" y2="853.000" stroke="#d1d5db" /><line x1="150.000" y1="890.000" x2="1010.000" y2="890.000" stroke="#d1d5db" /><text x="132.000" y="820.000" font-size="12" text-anchor="end" fill="#166534">PASS</text><text x="132.000" y="857.000" font-size="12" text-anchor="end" fill="#991b1b">FAIL</text><text x="132.000" y="894.000" font-size="12" text-anchor="end" fill="#6b7280">нет проверки</text><circle cx="150.000" cy="816.000" r="6" fill="#22c55e" data-role="golden-point" data-test="all-minus-q8-raw128" /><text x="150.000" y="922.000" font-size="10" text-anchor="middle" fill="#4b5563">1</text><circle cx="211.429" cy="816.000" r="6" fill="#22c55e" data-role="golden-point" data-test="all-plus-q8-raw128" /><text x="211.429" y="922.000" font-size="10" text-anchor="middle" fill="#4b5563">2</text><circle cx="272.857" cy="816.000" r="6" fill="#22c55e" data-role="golden-point" data-test="alternating-lsb-order" /><text x="272.857" y="922.000" font-size="10" text-anchor="middle" fill="#4b5563">3</text><circle cx="334.286" cy="816.000" r="6" fill="#22c55e" data-role="golden-point" data-test="alternating-zero-q8" /><text x="334.286" y="922.000" font-size="10" text-anchor="middle" fill="#4b5563">4</text><circle cx="395.714" cy="816.000" r="6" fill="#22c55e" data-role="golden-point" data-test="canonical-matrix" /><text x="395.714" y="922.000" font-size="10" text-anchor="middle" fill="#4b5563">5</text><circle cx="457.143" cy="816.000" r="6" fill="#22c55e" data-role="golden-point" data-test="four-independent-q8-scales" /><text x="457.143" y="922.000" font-size="10" text-anchor="middle" fill="#4b5563">6</text><circle cx="518.571" cy="816.000" r="6" fill="#22c55e" data-role="golden-point" data-test="matrix-cli-little-endian-output" /><text x="518.571" y="922.000" font-size="10" text-anchor="middle" fill="#4b5563">7</text><circle cx="580.000" cy="816.000" r="6" fill="#22c55e" data-role="golden-point" data-test="reject-nan-inf-scales" /><text x="580.000" y="922.000" font-size="10" text-anchor="middle" fill="#4b5563">8</text><circle cx="641.429" cy="816.000" r="6" fill="#22c55e" data-role="golden-point" data-test="reject-packed-length" /><text x="641.429" y="922.000" font-size="10" text-anchor="middle" fill="#4b5563">9</text><circle cx="702.857" cy="816.000" r="6" fill="#22c55e" data-role="golden-point" data-test="packed-tile-matches-16-canonical-rows" /><text x="702.857" y="922.000" font-size="10" text-anchor="middle" fill="#4b5563">10</text><circle cx="764.286" cy="816.000" r="6" fill="#22c55e" data-role="golden-point" data-test="q1-scale-two" /><text x="764.286" y="922.000" font-size="10" text-anchor="middle" fill="#4b5563">11</text><circle cx="825.714" cy="816.000" r="6" fill="#22c55e" data-role="golden-point" data-test="signed-q8-endpoints" /><text x="825.714" y="922.000" font-size="10" text-anchor="middle" fill="#4b5563">12</text><circle cx="887.143" cy="816.000" r="6" fill="#22c55e" data-role="golden-point" data-test="reject-scalar-length" /><text x="887.143" y="922.000" font-size="10" text-anchor="middle" fill="#4b5563">13</text><circle cx="948.571" cy="890.000" r="7" fill="#ffffff" stroke="#6b7280" stroke-width="2" data-role="golden-missing" /><text x="948.571" y="940.000" font-size="11" text-anchor="middle" fill="#374151">Q1 custom NPU</text><circle cx="1010.000" cy="890.000" r="7" fill="#ffffff" stroke="#6b7280" stroke-width="2" data-role="golden-missing" /><text x="1010.000" y="957.000" font-size="11" text-anchor="middle" fill="#374151">ShuffleNet golden</text><text x="55.000" y="985.000" font-size="12" font-weight="600" fill="#991b1b">Запуски без координат скорости (failed/no metric):</text><text x="55.000" y="1004.000" font-size="11" fill="#991b1b">bonsai27b-q1-cpu-a76-smoke-001, bonsai27b-q1-cpu-a76-pp512-tg128-001</text><text x="55.000" y="1023.000" font-size="11" fill="#991b1b">bonsai27b-q1-cpu-a76-pp512-tg128-002, vip9000-vpm-shufflenet-uint8-resident100-001</text><text x="55.000" y="1055.000" font-size="13" font-weight="600" fill="#111827">Вывод: сейчас измерена только CPU-генерация Bonsai; Q1 custom NPU ещё не имеет точки latency/speed.</text></svg>