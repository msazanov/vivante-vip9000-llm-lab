<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title description" font-family="Inter, DejaVu Sans, sans-serif"><title id="title">Packed Q1×Q8 EVIS на VIP9000: микрокernel и масштабирование Bonsai</title><desc id="description">Верхняя панель сравнивает два NPU-ядра на одинаковой форме. Нижняя XY-панель отделяет реальные измерения Bonsai от линейной оценки.</desc><rect width="1200" height="980" fill="#f8fafc" /><text x="55.000" y="52.000" font-size="28" font-weight="700" fill="#0f172a">Packed Q1×Q8 на VIP9000</text><text x="55.000" y="80.000" font-size="14" fill="#475569">Измерения на Orange Pi Zero 3W · A733 · NPU 1008 МГц</text><rect x="40" y="105" width="1120" height="350" rx="14" fill="#ffffff" stroke="#cbd5e1" /><text x="65.000" y="143.000" font-size="20" font-weight="700" fill="#0f172a">Одинаковая задача: 16×128</text><text x="65.000" y="168.000" font-size="13" fill="#64748b">Все четыре пары нормированы внутри своей метрики; меньше — быстрее.</text><text x="65.000" y="214.000" font-size="14" font-weight="600" fill="#334155">Циклы NPU</text><rect x="280.000" y="195.000" width="690.000" height="18" rx="4" fill="#94a3b8" /><rect x="280.000" y="218.000" width="68.916" height="18" rx="4" fill="#0ea5e9" /><text x="985.000" y="209.000" font-size="12" fill="#475569">133472 циклов</text><text x="985.000" y="232.000" font-size="12" fill="#0369a1">13331 циклов</text><text x="65.000" y="269.000" font-size="14" font-weight="600" fill="#334155">Device profiler</text><rect x="280.000" y="250.000" width="690.000" height="18" rx="4" fill="#94a3b8" /><rect x="280.000" y="273.000" width="90.657" height="18" rx="4" fill="#0ea5e9" /><text x="985.000" y="264.000" font-size="12" fill="#475569">137,000 мкс</text><text x="985.000" y="287.000" font-size="12" fill="#0369a1">18,000 мкс</text><text x="65.000" y="324.000" font-size="14" font-weight="600" fill="#334155">VIPLite run</text><rect x="280.000" y="305.000" width="690.000" height="18" rx="4" fill="#94a3b8" /><rect x="280.000" y="328.000" width="265.248" height="18" rx="4" fill="#0ea5e9" /><text x="985.000" y="319.000" font-size="12" fill="#475569">176,459 мкс</text><text x="985.000" y="342.000" font-size="12" fill="#0369a1">67,834 мкс</text><text x="65.000" y="379.000" font-size="14" font-weight="600" fill="#334155">End-to-end</text><rect x="280.000" y="360.000" width="690.000" height="18" rx="4" fill="#94a3b8" /><rect x="280.000" y="383.000" width="282.727" height="18" rx="4" fill="#0ea5e9" /><text x="985.000" y="374.000" font-size="12" fill="#475569">178,668 мкс</text><text x="985.000" y="397.000" font-size="12" fill="#0369a1">73,209 мкс</text><text x="795.000" y="143.000" font-size="13" fill="#64748b">Scalar Q1×F32</text><text x="925.000" y="143.000" font-size="13" fill="#0284c7">EVIS packed Q1×Q8</text><text x="65.000" y="432.000" font-size="17" font-weight="700" fill="#0369a1">Ускорение по циклам: 10,01×</text><text x="430.000" y="432.000" font-size="15" font-weight="600" fill="#15803d">Golden: PASS · 100/100 стабильных запусков</text><rect x="40" y="475" width="1120" height="435" rx="14" fill="#ffffff" stroke="#cbd5e1" /><text x="65.000" y="515.000" font-size="20" font-weight="700" fill="#0f172a">Реальный Bonsai blk.0.ffn_gate</text><text x="65.000" y="540.000" font-size="13" fill="#64748b">K=5120; X = выходные строки, Y = медиана end-to-end, логарифмические оси</text><line x1="115.000" y1="575.000" x2="115.000" y2="840.000" stroke="#e2e8f0" stroke-width="1" /><text x="115.000" y="863.000" font-size="11" text-anchor="middle" fill="#64748b">16</text><line x1="249.821" y1="575.000" x2="249.821" y2="840.000" stroke="#e2e8f0" stroke-width="1" /><text x="249.821" y="863.000" font-size="11" text-anchor="middle" fill="#64748b">64</text><line x1="384.642" y1="575.000" x2="384.642" y2="840.000" stroke="#e2e8f0" stroke-width="1" /><text x="384.642" y="863.000" font-size="11" text-anchor="middle" fill="#64748b">256</text><line x1="519.462" y1="575.000" x2="519.462" y2="840.000" stroke="#e2e8f0" stroke-width="1" /><text x="519.462" y="863.000" font-size="11" text-anchor="middle" fill="#64748b">1024</text><line x1="654.283" y1="575.000" x2="654.283" y2="840.000" stroke="#e2e8f0" stroke-width="1" /><text x="654.283" y="863.000" font-size="11" text-anchor="middle" fill="#64748b">4096</text><line x1="795.000" y1="575.000" x2="795.000" y2="840.000" stroke="#e2e8f0" stroke-width="1" /><text x="795.000" y="863.000" font-size="11" text-anchor="middle" fill="#64748b">17408</text><line x1="115.000" y1="835.958" x2="795.000" y2="835.958" stroke="#e2e8f0" stroke-width="1" /><text x="103.000" y="839.958" font-size="11" text-anchor="end" fill="#64748b">0,5</text><line x1="115.000" y1="809.869" x2="795.000" y2="809.869" stroke="#e2e8f0" stroke-width="1" /><text x="103.000" y="813.869" font-size="11" text-anchor="end" fill="#64748b">1,0</text><line x1="115.000" y1="757.691" x2="795.000" y2="757.691" stroke="#e2e8f0" stroke-width="1" /><text x="103.000" y="761.691" font-size="11" text-anchor="end" fill="#64748b">4,0</text><line x1="115.000" y1="705.513" x2="795.000" y2="705.513" stroke="#e2e8f0" stroke-width="1" /><text x="103.000" y="709.513" font-size="11" text-anchor="end" fill="#64748b">16,0</text><line x1="115.000" y1="653.335" x2="795.000" y2="653.335" stroke="#e2e8f0" stroke-width="1" /><text x="103.000" y="657.335" font-size="11" text-anchor="end" fill="#64748b">64,0</text><line x1="115.000" y1="601.157" x2="795.000" y2="601.157" stroke="#e2e8f0" stroke-width="1" /><text x="103.000" y="605.157" font-size="11" text-anchor="end" fill="#64748b">256,0</text><line x1="115.000" y1="575.068" x2="795.000" y2="575.068" stroke="#e2e8f0" stroke-width="1" /><text x="103.000" y="579.068" font-size="11" text-anchor="end" fill="#64748b">512,0</text><line x1="115.000" y1="575.000" x2="115.000" y2="840.000" stroke="#475569" stroke-width="1.5" /><line x1="115.000" y1="840.000" x2="795.000" y2="840.000" stroke="#475569" stroke-width="1.5" /><text x="72.000" y="563.000" font-size="12" fill="#475569">мс</text><circle cx="115.000" cy="829.172" r="7" fill="#0ea5e9" stroke="#ffffff" /><circle cx="519.462" cy="690.037" r="7" fill="#0ea5e9" stroke="#ffffff" /><line x1="115.000" y1="829.172" x2="519.462" y2="690.037" stroke="#0ea5e9" stroke-width="2.5" /><line x1="519.462" y1="690.037" x2="795.000" y2="583.399" stroke="#f97316" stroke-width="2" stroke-dasharray="7 6" /><circle cx="795.000" cy="583.399" r="7" fill="#ffffff" stroke="#f97316" stroke-width="3" /><rect x="788.000" y="752.127" width="14" height="14" fill="#22c55e" stroke="#ffffff" /><text x="825.000" y="590.000" font-size="15" font-weight="700" fill="#0f172a">Измеренные точки</text><text x="825.000" y="620.000" font-size="14" font-weight="600" fill="#0284c7">16 строк · измерено</text><text x="825.000" y="640.000" font-size="12" fill="#475569">E2E 0,599 мс · device 0,535 мс · golden PASS</text><text x="825.000" y="674.000" font-size="14" font-weight="600" fill="#0284c7">1024 строк · измерено</text><text x="825.000" y="694.000" font-size="12" fill="#475569">E2E 24,137 мс · device 23,585 мс · golden PASS</text><text x="825.000" y="733.000" font-size="14" font-weight="600" fill="#15803d">CPU · 17408 строк · измерено</text><text x="825.000" y="753.000" font-size="12" fill="#475569">3,850 мс на полном слое</text><text x="825.000" y="796.000" font-size="14" font-weight="600" fill="#ea580c">NPU · 17408 строк · 410,3 мс</text><text x="825.000" y="816.000" font-size="12" font-weight="600" fill="#ea580c">линейная оценка, не измерение</text><text x="825.000" y="858.000" font-size="12" fill="#475569">Текущий EVIS — programmable shader/PPU,</text><text x="825.000" y="876.000" font-size="12" fill="#475569">а не эффективный tensor-core GEMV.</text><text x="55.000" y="948.000" font-size="15" font-weight="700" fill="#0f172a">Вывод: транспорт packed Q1 ускорен без потери качества, но полный decode пока оставляем CPU.</text></svg>