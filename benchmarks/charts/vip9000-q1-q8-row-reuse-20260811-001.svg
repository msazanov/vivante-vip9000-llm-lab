<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1070" viewBox="0 0 1200 1070" role="img" aria-labelledby="title description" font-family="Inter, DejaVu Sans, sans-serif"><title id="title">Переиспользование Q8 в бинарном ядре Bonsai на VIP9000</title><desc id="description">Три отдельные панели показывают cycles микротеста, измеренный tile Bonsai и честное сравнение полного CPU слоя с NPU-прогнозом.</desc><rect x="0.000" y="0.000" width="1200.000" height="1070.000" fill="#f8fafc" /><text x="55.000" y="48.000" font-size="28" font-weight="700" fill="#0f172a">Q1×Q8 Bonsai на VIP9000</text><text x="55.000" y="76.000" font-size="14" fill="#475569">Меньше — быстрее · точность всех показанных вариантов прошла golden</text><rect x="40.000" y="100.000" width="1120.000" height="390.000" rx="14" fill="#ffffff" stroke="#cbd5e1" /><text x="65.000" y="138.000" font-size="20" font-weight="700" fill="#0f172a">1. Микротест 64×128 · аппаратные cycles NPU</text><text x="65.000" y="163.000" font-size="13" fill="#64748b">Сравнивается только стоимость kernel; fixed overhead драйвера сюда не входит.</text><text x="65.000" y="208.000" font-size="13" font-weight="600" fill="#334155">E003 · Q8 читается заново</text><rect x="350.000" y="190.000" width="434.222" height="22.000" rx="4" fill="#64748b" /><text x="1020.000" y="207.000" font-size="13" font-weight="600" fill="#64748b">28 514</text><text x="65.000" y="253.000" font-size="13" font-weight="600" fill="#334155">E011 · Q8 на 4 строки</text><rect x="350.000" y="235.000" width="389.633" height="22.000" rx="4" fill="#0284c7" /><text x="1020.000" y="252.000" font-size="13" font-weight="600" fill="#0284c7">25 586</text><text x="65.000" y="298.000" font-size="13" font-weight="600" fill="#334155">E011-v3 · direct signs</text><rect x="350.000" y="280.000" width="426.364" height="22.000" rx="4" fill="#f97316" /><text x="1020.000" y="297.000" font-size="13" font-weight="600" fill="#f97316">27 948–28 048</text><text x="65.000" y="343.000" font-size="13" font-weight="600" fill="#334155">E012 · signed read</text><rect x="350.000" y="325.000" width="391.445" height="22.000" rx="4" fill="#f97316" /><text x="1020.000" y="342.000" font-size="13" font-weight="600" fill="#f97316">25 705</text><text x="65.000" y="388.000" font-size="13" font-weight="600" fill="#334155">E013 · Q8 на 8 строк</text><rect x="350.000" y="370.000" width="650.000" height="22.000" rx="4" fill="#f97316" /><text x="1020.000" y="387.000" font-size="13" font-weight="600" fill="#f97316">42 310–43 057</text><text x="65.000" y="433.000" font-size="13" font-weight="600" fill="#334155">E014 · vector FP32</text><rect x="350.000" y="415.000" width="374.161" height="22.000" rx="4" fill="#16a34a" /><text x="1020.000" y="432.000" font-size="13" font-weight="600" fill="#16a34a">24 570</text><text x="65.000" y="475.000" font-size="15" font-weight="700" fill="#15803d">Лучший результат: E014, Q8 reuse R4 + vector FP32</text><rect x="40.000" y="515.000" width="1120.000" height="250.000" rx="14" fill="#ffffff" stroke="#cbd5e1" /><text x="65.000" y="553.000" font-size="20" font-weight="700" fill="#0f172a">2. Реальный tile Bonsai 1024×5120 · end-to-end</text><text x="65.000" y="578.000" font-size="13" fill="#64748b">Одна форма, одни Q1_0 weights и Q8_0 activation, 19 steady запусков.</text><text x="65.000" y="623.000" font-size="14" font-weight="600" fill="#334155">E003 · прежнее ядро</text><rect x="310.000" y="605.000" width="650.000" height="24.000" rx="4" fill="#64748b" /><text x="980.000" y="623.000" font-size="13" font-weight="600" fill="#64748b">24,137 ms</text><text x="65.000" y="665.000" font-size="14" font-weight="600" fill="#334155">E011 · Q8 reuse R4</text><rect x="310.000" y="647.000" width="381.050" height="24.000" rx="4" fill="#0284c7" /><text x="980.000" y="665.000" font-size="13" font-weight="600" fill="#0284c7">14,150 ms</text><text x="65.000" y="707.000" font-size="14" font-weight="600" fill="#334155">E014 · vector FP32</text><rect x="310.000" y="689.000" width="376.186" height="24.000" rx="4" fill="#16a34a" /><text x="980.000" y="707.000" font-size="13" font-weight="600" fill="#16a34a">13,970 ms</text><text x="65.000" y="747.000" font-size="16" font-weight="700" fill="#15803d">E014: 1,73× быстрее исходного E003 на измеренном NPU tile</text><rect x="40.000" y="790.000" width="1120.000" height="205.000" rx="14" fill="#ffffff" stroke="#cbd5e1" /><text x="65.000" y="828.000" font-size="20" font-weight="700" fill="#0f172a">3. Полный слой 17408×5120 · CPU измерен, NPU оценён</text><text x="65.000" y="853.000" font-size="13" fill="#64748b">Логарифмическая шкала времени позволяет видеть обе величины; короче — лучше.</text><text x="65.000" y="898.000" font-size="14" font-weight="600" fill="#334155">CPU full layer</text><line x1="330.000" y1="892.000" x2="840.000" y2="892.000" stroke="#e2e8f0" stroke-width="2" /><rect x="330.000" y="880.000" width="38.369" height="24.000" rx="4" fill="#16a34a" /><text x="1135.000" y="898.000" font-size="12" font-weight="600" text-anchor="end" fill="#16a34a">3,850 ms · измерено</text><text x="65.000" y="945.000" font-size="14" font-weight="600" fill="#334155">NPU E014 ×17 tiles</text><line x1="330.000" y1="939.000" x2="840.000" y2="939.000" stroke="#e2e8f0" stroke-width="2" /><rect x="330.000" y="927.000" width="481.777" height="24.000" rx="4" fill="#f97316" /><text x="1135.000" y="945.000" font-size="12" font-weight="600" text-anchor="end" fill="#f97316">237,482 ms · прогноз, не измерение</text><text x="55.000" y="1040.000" font-size="16" font-weight="700" fill="#991b1b">Ускорение tokens/s пока не доказано: прогноз NPU в 61,68× медленнее CPU.</text></svg>